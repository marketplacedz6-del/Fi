<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المنتج | Elegance Home &amp; Style</title>
<meta name="description" content="تفاصيل المنتج — الدفع عند الاستلام، توصيل لجميع الولايات.">
<link rel="icon" type="image/png" href="assets/img/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="product">
<header class="site" id="eh-header"></header>

<div class="container">
  <div class="pg-grid" id="product-root"></div>
</div>

<footer class="site" id="eh-footer"></footer>
<a class="admin-link" href="admin.html" title="لوحة التحكم">⚙</a>

<!-- الشريط الثابت أسفل الشاشة -->
<div class="sticky-bar" id="sticky-bar">
  <span class="price" id="sticky-price"></span>
  <button class="btn" id="sticky-add">🛒 أضف إلى السلة</button>
</div>

<!-- معرض التكبير -->
<div class="zoom-overlay" id="zoom-overlay">
  <button class="zoom-close" id="zoom-close">✕</button>
  <img id="zoom-img" alt="تكبير الصورة">
  <div class="zoom-hint">اسحب للتكبير أو انقر للإغلاق</div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/pixels.js"></script>
<script src="assets/js/product.js"></script>
</body>
</html>
